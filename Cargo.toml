# cargo-features = ["codegen-backend"]
[package]
name = "lamellar"
version = "0.8.1"
authors = [
    "Ryan D. Friese <ryan.friese@pnnl.gov>",
    "Roberto Gioiosa <roberto.gioiosa@pnnl.gov>",
    "Joseph Cottam <joseph.cottam@pnnl.gov>",
    "Greg Roek <gregory.roek@pnnl.gov>",
    "Erdal Mutlu <erdal.mutlu@pnnl.gov>",
]
edition = "2021"
description = "Lamellar is an asynchronous tasking runtime for HPC systems developed in RUST."
readme = "README.md"
repository = "https://github.com/pnnl/lamellar"
homepage = "https://github.com/pnnl/lamellar"
license-file = "LICENSE"
keywords = ["hpc", "runtime", "pgas", "distributed", "asynchronous"]
categories = ["asynchronous", "concurrency", "network-programming", "science"]

[dependencies]
# --- local workspace crates ---
lamellar-impl = { version = "0.8.0", path = "impl" }
lamellar_main = { version = "0.1.0", path = "./lamellar_main", optional = true }
lamellar-prof = { version = "0.2.0", path = "./lamellar-prof" }

# --- HPC network/process-management backends (all optional, feature-gated) ---
hwlocality = { version = "1.0.0-alpha.12", optional = true }
lamellar-ucc-sys = { version = "0.1.0", optional = true }
lamellar-ucx-sys = { version = "0.1.0", optional = true }
libfabric = { package = "lamellar-libfabric", version = "0.1.0", features = [
    # "use-async-std",
    "threading-domain",
], optional = true }
libfabric-sys = { package = "lamellar-libfabric-sys", version = "0.1.0", optional = true }
pmi = { version = "0.1.0", optional = true }
pmix-sys = { version = "0.1.0", optional = true }
prrte-sys = { version = "0.1.0", optional = true }
rofisys = { version = "0.5.0", optional = true }

# --- async runtime / executors ---
async-global-executor = "2.4.1"
async-lock = "3.4.1"
async-recursion = "1.0.0"
async-std = "1.13.2"
async-task = "4.3.0"
async-trait = "0.1.58"
futures-executor = "0.3.34"
futures-util = "0.3.31"
pin-project = "1.1.10"
tokio = { version = "1.47.1", features = ["full"], optional = true }

# --- concurrency / sync primitives ---
core_affinity = "0.8.3"
crossbeam = "0.8.4"
parking_lot = { version = "0.12.4", features = [
    "arc_lock",
    "send_guard",
    "serde",
] }
thread_local = "1.1.9"

# --- serialization ---
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_bytes = "0.11.17"
zerocopy = { version = "0.8.48", features = ["derive"] }
zerocopy-derive = "0.8.48"

# --- data structures / general utilities ---
anyhow = "1.0.99"
derive_more = { version = "1.0.0", features = ["add", "from", "into"] }
enum_dispatch = "0.3.8"
envy = "0.4.2"
indexmap = "2.11.1"                                                     #lamellar_alloc
memmap = "0.7.0"
page_size = "0.6.0"
paste = "1.0.15"
rand = "0.9.2"
shared_memory = "0.12.4"
thiserror = { version = "2.0.16", optional = true }

# --- codegen / reflection / diagnostics ---
backtrace = { version = "0.3", optional = true }
crabtime = "1.1.4"
inventory = "0.3.21"
libc = { version = "0.2.175", optional = true }
tracing = "0.1.41"

[dev-dependencies]
assert_cmd = "2.0.4"
backtrace = "0.3"
bincode = { version = "2.0.1", features = ["serde"] }
criterion = "0.5"
hostname = "0.3"
matrixmultiply = "0.3.2"
rayon = "1.1"
rkyv = "0.8"
serial_test = "3.2.0"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "registry",
] }
trybuild = "1.0.71"
#packed_simd = { version = "0.3.4", package = "packed_simd_2" } #uncomment if using nightly tool chain and want to run the am_flops example


[workspace]
members = [
    "impl",
    "hpc_launch_impl",
    "hpc_launch",
    "lamellar_main_impl",
    "lamellar_main",
]

# Set the settings for build scripts and proc-macros.
[profile.dev.build-override]
opt-level = 3

#features are strictly additive.... can't have mutual exclusitivity
[features]
default = [
    "with-pmix",
    "vendored-pmi",
    "enable-lamellar-main",
    "enable-numa-detect",
    "vendored-libevent",
    "vendored-pmix",
]

# --- launcher (lamellar_main / hpc_launch) ---
enable-lamellar-main = ["lamellar_main/use-prterun", "prrte-sys/prrte-src"]
with-salloc = ["lamellar_main/with-salloc"]

# --- NUMA / hwloc detection, used by `#[lamellar::main]` to pick PE-per-node defaults ---
# vendored-hwloc builds PRRTE's (and lamellar's own NUMA-detection) hwloc from
# source. Omit this and set HWLOC_DIR to the install prefix (and, for
# hwlocality-sys, ensure it's on PKG_CONFIG_PATH) to link a system hwloc
# instead. Use system hwloc on macOS, where hwloc's vendored autotools build
# fails.
vendored-hwloc = ["prrte-sys?/vendored-hwloc", "hwlocality?/vendored"]
# Builds PRRTE's (and, when pmix is also vendored, PMIx's) libevent from source.
# Only takes effect if prrte-sys and/or pmix-sys are already pulled in by
# enable-lamellar-main / enable-rofi-c(-shared). Omit and set LIBEVENT_DIR (or
# rely on system pkg-config auto-detection) to link a system libevent instead.
vendored-libevent = [
    "prrte-sys?/vendored-libevent",
    "pmix-sys?/vendored-libevent",
    "rofisys?/vendored-libevent",
]
# Builds PMIx from source (via pmix-sys/openpmix-src) instead of linking a system
# PMIx. Only takes effect if pmix-sys is already pulled in (enable-lamellar-main
# or enable-rofi-c(-shared)). Omit and set PMIX_DIR (or rely on system pkg-config
# auto-detection) to link a system PMIx instead — useful on clusters where PMIx
# is already installed and version-matched to the system Slurm/PRRTE.
vendored-pmix = [
    "prrte-sys?/vendored-pmix",
    "pmix-sys?/openpmix-src",
    "rofisys?/vendored-pmix",
]
enable-numa-detect = ["hwlocality"]

# --- PMI (process management interface) ---
with-pmi1 = ["pmi/with-pmi1"]
with-pmi2 = ["pmi/with-pmi2"]
with-pmix = ["pmi/with-pmix"]
with-pmix-vendored = ["pmi/with-pmix-vendored"]
# Vendors pmix-sys as pulled in through the `pmi` abstraction crate (used by
# enable-libfabric/enable-ucx) — a separate instance from the one governed by
# vendored-pmix/vendored-libevent above, which only cover pmix-sys as pulled in
# directly by lamellar-runtime/rofisys/prrte-sys. Only takes effect once a pmi
# backend is selected (with-pmix/with-pmi1/with-pmi2).
vendored-pmi = ["pmi/vendored"]

# Convenience alias for the default feature set minus vendored-pmi/vendored-libevent/
# vendored-pmix (Cargo features are additive-only, so there's no way to remove just
# those from `default` without restating the rest). Use on clusters with a
# system-installed, version-matched PMIx/PRRTE (and libevent) already on
# PKG_CONFIG_PATH or pointed to via PMIX_DIR/LIBEVENT_DIR:
#   cargo build --no-default-features --features system-pmix-launcher
# Kept in sync with `default` by hand — if `default`'s core set changes, update both.
system-pmix-launcher = [
    "with-pmix",
    "enable-lamellar-main",
    "enable-numa-detect",
]

# --- network backends ---
rofi-c = []
# Base rofi-c backend: builds against rofi's default PMI-1 client (simple_pmi.c),
# no PMIx involved. Add enable-rofi-c-pmix on top to switch rofi's process
# management to PMIx instead (rofi has no PMI-2 client, so PMI-1/PMIx are the
# only options). Vendoring PMIx here is controlled by the top-level
# vendored-pmix feature (which pulls in rofisys?/vendored-pmix); omit it and
# set PMIX_LIB_DIR/PMIX_INCLUDE_DIR to link a system PMIx instead.
enable-rofi-c = ["rofisys", "libc", "libfabric"]
enable-rofi-c-pmix = ["enable-rofi-c", "rofisys/pmix"]
enable-rofi-c-shared = [
    "rofisys/shared",
    "libc",
    "libfabric",
    "libfabric-sys/shared",
]
enable-rofi-c-shared-pmix = ["enable-rofi-c-shared", "rofisys/pmix"]
enable-rofi-rust = []
enable-libfabric = ["libfabric", "pmi", "libc"]
enable-libfabric-sys = ["libfabric-sys", "pmi", "libc"]
enable-libfabric-async = ["libfabric/use-async-std", "pmi"]
enable-ucx = ["lamellar-ucx-sys", "lamellar-ucc-sys", "pmi", "thiserror"]

# --- executor ---
tokio-executor = ["tokio"]

# --- runtime behavior / diagnostics ---
disable-runtime-warnings = []
runtime-warnings-panic = []
enable-stats = []
enable-on-node-shmem = []
slurm-test = []
enable-prof = [
    "lamellar-prof/use-lamellar",
    "backtrace",
    "lamellar_main/enable-prof",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release-dev]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 256

[profile.release-debug]
inherits = "release-dev"
debug = true
[profile.release-debug.package."*"]
debug = true

[package.metadata.docs.rs]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]


[lib]
doctest = false
name = "lamellar"
path = "src/lib.rs"

# ring's build.rs unconditionally emits `rerun-if-env-changed=CARGO_MANIFEST_DIR`,
# which spuriously invalidates its fingerprint and forces a full rebuild of the
# ring/rustls/ureq chain whenever a nested cargo invocation (e.g. our own tests
# shelling out to `cargo build --example`) computes that env var differently
# than the outer `cargo test` run. Fix is unreleased; pin to the commit with it.
[patch.crates-io]
ring = { git = "https://github.com/briansmith/ring", rev = "840167e18e4fa837eb48de46500454a616a15a6e" }

# Local testing against process_management/* and communication_frameworks/*
# from the lamellar-repo monorepo instead of the published crates.io versions.
